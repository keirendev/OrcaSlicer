<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>K1 camera</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
    img { width:100%; height:100%; display:block; object-fit:contain; background:#000; }
    #status { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      padding:16px; box-sizing:border-box; color:#ddd; background:#111; text-align:center;
      font:13px sans-serif; }
  </style>
</head>
<body>
  <img alt="Live K1 camera preview">
  <div id="status">Connecting to K1 camera…</div>
  <script>
  (function () {
    "use strict";
    const image = document.querySelector("img");
    const status = document.querySelector("#status");
    let reconnectTimer = null;
    let frameTimer = null;
    let stallTimer = null;
    let generation = 0;
    let stopped = false;
    let reportedPlaying = false;

    function report(type, detail) {
      if (window.parent !== window)
        window.parent.postMessage(Object.assign({source: "orca-k1-camera", type: type}, detail || {}), location.origin);
    }

    function teardown() {
      clearTimeout(reconnectTimer);
      clearTimeout(frameTimer);
      clearTimeout(stallTimer);
      image.onload = null;
      image.onerror = null;
      image.removeAttribute("src");
      reportedPlaying = false;
      generation++;
    }

    function requestFrame(activeGeneration) {
      if (stopped || activeGeneration !== generation)
        return;
      clearTimeout(stallTimer);
      image.onload = function () {
        if (activeGeneration !== generation)
          return;
        clearTimeout(stallTimer);
        status.style.display = "none";
        if (!reportedPlaying) {
          reportedPlaying = true;
          report("playing", {width: image.naturalWidth, height: image.naturalHeight});
        }
        frameTimer = setTimeout(function () { requestFrame(activeGeneration); }, 200);
      };
      image.onerror = function () {
        if (activeGeneration === generation)
          reconnect("Camera disconnected. Reconnecting…");
      };
      image.src = "/api/frame.jpeg?src=k1_orca&v=" + Date.now();
      stallTimer = setTimeout(function () {
        if (!stopped && activeGeneration === generation)
          reconnect("Camera disconnected. Reconnecting…");
      }, 12000);
    }

    function reconnect(message) {
      teardown();
      if (stopped)
        return;
      status.style.display = "flex";
      status.textContent = message || "Camera disconnected. Reconnecting…";
      report("disconnected", {message: status.textContent});
      reconnectTimer = setTimeout(connect, 2500);
    }

    function connect() {
      if (stopped)
        return;
      const activeGeneration = ++generation;
      requestFrame(activeGeneration);
    }

    window.addEventListener("pagehide", function () {
      stopped = true;
      teardown();
    }, {once:true});
    connect();
  }());
  </script>
</body>
</html>

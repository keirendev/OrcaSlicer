<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; connect-src ws://127.0.0.1:*; media-src blob:; script-src 'self'; style-src 'unsafe-inline'">
  <title>K1 camera</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure {
      display: none !important;
    }

    #status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 16px;
      color: #ddd;
      background: #111;
      text-align: center;
      font: 13px sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <video autoplay muted playsinline disablepictureinpicture disableremoteplayback></video>
  <div id="status">Connecting to K1 camera…</div>
  <script src="fmp4_retime.js"></script>
  <script src="camera.js"></script>
</body>
</html>
